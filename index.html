<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice VIP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 24px;
            border: 1px solid #2a2a2a;
        }
        h1 {
            color: #fff;
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 16px;
            text-align: center;
        }
        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 12px;
        }
        input:focus {
            border-color: #555;
            outline: none;
        }
        .btn {
            background: #2a2a2a;
            border: none;
            padding: 12px;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover {
            background: #333;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #2a2a2a;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            border-color: #555;
        }
        .hidden {
            display: none;
        }
        .resultado {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
        }
        .resultado.sucesso {
            display: block;
            border-color: #4ade80;
        }
        .resultado.erro {
            display: block;
            border-color: #ff6b6b;
        }
        .link-cobranca {
            word-break: break-all;
            font-size: 14px;
            margin: 8px 0;
        }
        .link-cobranca a {
            color: #4ade80;
            text-decoration: none;
        }
        .link-cobranca a:hover {
            text-decoration: underline;
        }
        .pix-info img {
            max-width: 160px;
            display: block;
            margin: 10px auto;
            background: #fff;
            padding: 8px;
            border-radius: 6px;
        }
        .pix-info textarea {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            color: #aaa;
            font-size: 11px;
            font-family: monospace;
            resize: none;
        }
        .btn-copiar {
            background: #2a2a2a;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-copiar:hover {
            background: #333;
        }
        .aviso {
            color: #555;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
        }
        .erro-login {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- LOGIN -->
        <div id="telaLogin" class="card">
            <h1>Alice VIP</h1>
            <label>Usuário</label>
            <input type="text" id="usuario" value="admin">
            <label>Senha</label>
            <input type="password" id="senha" value="123">
            <button class="btn" onclick="fazerLogin()">Entrar</button>
            <div id="erroLogin" class="erro-login">Usuário ou senha incorretos</div>
        </div>

        <!-- ADMIN -->
        <div id="telaAdmin" class="card hidden">
            <h1>Gerar Cobrança</h1>
            <label>Valor (R$)</label>
            <input type="number" id="valor" step="0.01" value="25.00">
            <label>Descrição</label>
            <input type="text" id="descricao" placeholder="Opcional">
            <label>Cliente</label>
            <input type="text" id="cliente" placeholder="Opcional">
            <label>Link personalizado (opcional)</label>
            <input type="text" id="linkPersonalizado" placeholder="Ex: cliente01">
            <button class="btn" onclick="gerarCobranca()">Gerar</button>
            <button class="btn btn-secondary" onclick="sair()">Sair</button>

            <div id="resultado" class="resultado">
                <p id="mensagemResultado"></p>
                <div id="detalhesResultado"></div>
            </div>
        </div>

    </div>

    <script>
        const USUARIO = 'admin';
        const SENHA = '123';

        function fazerLogin() {
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('erroLogin');

            if (usuario === USUARIO && senha === SENHA) {
                erro.style.display = 'none';
                document.getElementById('telaLogin').classList.add('hidden');
                document.getElementById('telaAdmin').classList.remove('hidden');
            } else {
                erro.style.display = 'block';
            }
        }

        function sair() {
            document.getElementById('telaAdmin').classList.add('hidden');
            document.getElementById('telaLogin').classList.remove('hidden');
            document.getElementById('usuario').value = 'admin';
            document.getElementById('senha').value = '123';
            document.getElementById('resultado').className = 'resultado';
            document.getElementById('resultado').style.display = 'none';
        }

        async function gerarCobranca() {
            const valor = parseFloat(document.getElementById('valor').value);
            const descricao = document.getElementById('descricao').value;
            const cliente = document.getElementById('cliente').value;
            const linkPersonalizado = document.getElementById('linkPersonalizado').value;
            const resultado = document.getElementById('resultado');
            const mensagem = document.getElementById('mensagemResultado');
            const detalhes = document.getElementById('detalhesResultado');

            if (!valor || valor <= 0) {
                resultado.className = 'resultado erro';
                resultado.style.display = 'block';
                mensagem.textContent = 'Valor inválido';
                detalhes.innerHTML = '';
                return;
            }

            resultado.className = 'resultado';
            mensagem.textContent = '...';
            detalhes.innerHTML = '';

            try {
                const response = await fetch('/api/gerar-cobranca', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ valor, descricao, cliente, linkPersonalizado })
                });
                const data = await response.json();

                if (data.success) {
                    resultado.className = 'resultado sucesso';
                    resultado.style.display = 'block';
                    mensagem.textContent = 'Cobrança gerada';
                    detalhes.innerHTML = `
                        <div class="link-cobranca"><a href="${data.linkCompleto}" target="_blank">${data.linkCompleto}</a></div>
                        <button class="btn-copiar" onclick="copiar('${data.linkCompleto}')">Copiar link</button>
                        <div class="pix-info">
                            <img src="${data.pix.qrCode}" alt="QR" />
                            <textarea rows="2" readonly>${data.pix.codigoCopiaCola}</textarea>
                            <button class="btn-copiar" onclick="copiar('${data.pix.codigoCopiaCola}')">Copiar código</button>
                        </div>
                    `;
                } else {
                    resultado.className = 'resultado erro';
                    resultado.style.display = 'block';
                    mensagem.textContent = data.error || 'Erro';
                    detalhes.innerHTML = '';
                }
            } catch {
                resultado.className = 'resultado erro';
                resultado.style.display = 'block';
                mensagem.textContent = 'Erro ao gerar';
                detalhes.innerHTML = '';
            }
        }

        function copiar(texto) {
            navigator.clipboard.writeText(texto);
            alert('Copiado');
        }

        document.getElementById('senha').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });
        document.getElementById('usuario').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
