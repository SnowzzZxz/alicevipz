<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>Alice VIP 🔥</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #050505; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 420px; width: 100%; }
        .card { background: #73187d; border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        h1 { color: #FF00FF; font-size: 24px; margin-bottom: 8px; }
        .sub { color: #adb5bd; font-size: 14px; margin-bottom: 16px; }
        .btn { background: #FF00FF; border: none; padding: 14px; border-radius: 8px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; transition: all 0.3s; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-secondary { background: transparent; border: 1px solid #6b7280; margin-top: 10px; color: #adb5bd; }
        .btn-secondary:hover { border-color: #FF00FF; color: #fff; }
        .footer { color: #6b7280; font-size: 12px; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔥 Alice VIP</h1>
            <div class="sub">Conteúdo exclusivo e cobranças rápidas via PIX</div>
            <a href="/admin"><button class="btn">🔐 Painel Admin</button></a>
            <button class="btn btn-secondary" onclick="window.location.href='/'">Voltar</button>
        </div>
        <div class="footer">© 2026 Alice VIP - Todos os direitos reservados</div>
    </div>
</body>
</html>
