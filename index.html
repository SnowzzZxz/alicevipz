<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Cobrança</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 400px; width: 100%; }
        .card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 24px;
            border: 1px solid #2a2a2a;
        }
        h1 {
            color: #fff;
            font-size: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 12px;
        }
        input:focus {
            border-color: #555;
            outline: none;
        }
        .btn {
            background: #2a2a2a;
            border: none;
            padding: 12px;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background: #333;
        }
        .resultado {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
        }
        .resultado.sucesso {
            display: block;
            border-color: #4ade80;
        }
        .resultado.erro {
            display: block;
            border-color: #ff6b6b;
        }
        .link-cobranca {
            word-break: break-all;
            font-size: 14px;
            margin: 8px 0;
        }
        .link-cobranca a {
            color: #4ade80;
            text-decoration: none;
        }
        .pix-info img {
            max-width: 160px;
            display: block;
            margin: 10px auto;
            background: #fff;
            padding: 8px;
            border-radius: 6px;
        }
        .pix-info textarea {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            color: #aaa;
            font-size: 11px;
            font-family: monospace;
            resize: none;
        }
        .btn-copiar {
            background: #2a2a2a;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-copiar:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>💰 Gerar Cobrança</h1>

            <label>Valor (R$)</label>
            <input type="number" id="valor" step="0.01" value="25.00">

            <label>Descrição (opcional)</label>
            <input type="text" id="descricao" placeholder="Ex: Conteúdo exclusivo">

            <label>Cliente (opcional)</label>
            <input type="text" id="cliente" placeholder="Nome do cliente">

            <label>Link personalizado (opcional)</label>
            <input type="text" id="linkPersonalizado" placeholder="Ex: cliente01">

            <button class="btn" onclick="gerarCobranca()">🚀 Gerar Cobrança</button>

            <div id="resultado" class="resultado">
                <p id="mensagemResultado"></p>
                <div id="detalhesResultado"></div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'zpk_541f4b2f71855fb26e1201a7';
        const CLIENT_SECRET = 'zsk_87b13fb23ba5eed5d6d9f0f9e6153d20dfeac10e24a66dd6';
        const ZPAY_API_URL = 'https://zpaysolution.com/api/v1';

        async function gerarCobranca() {
            const valor = parseFloat(document.getElementById('valor').value);
            const descricao = document.getElementById('descricao').value;
            const cliente = document.getElementById('cliente').value;
            const linkPersonalizado = document.getElementById('linkPersonalizado').value;

            const resultado = document.getElementById('resultado');
            const mensagem = document.getElementById('mensagemResultado');
            const detalhes = document.getElementById('detalhesResultado');

            if (!valor || valor <= 0) {
                resultado.className = 'resultado erro';
                resultado.style.display = 'block';
                mensagem.textContent = '❌ Digite um valor válido';
                detalhes.innerHTML = '';
                return;
            }

            resultado.className = 'resultado';
            mensagem.textContent = '⏳ Gerando...';
            detalhes.innerHTML = '';

            try {
                const response = await fetch(`${ZPAY_API_URL}/payments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'client-id': CLIENT_ID,
                        'client-secret': CLIENT_SECRET
                    },
                    body: JSON.stringify({
                        amount: parseFloat(valor),
                        payerName: cliente || 'Cliente',
                        description: descricao || 'Cobrança'
                    })
                });

                const data = await response.json();
                console.log('📦 Resposta Zpay:', data);

                const paymentId = data.paymentId || data.id || data.transactionId;
                const codigoPix = data.copyPaste || data.pixCode || data.pix_code || data.brCode || data.pix || null;
                const qrCode = data.qrCodeBase64 || data.qrCode || data.qr_code ||
                    `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(codigoPix || paymentId)}`;

                if (paymentId) {
                    let linkId = linkPersonalizado ? linkPersonalizado.trim() : null;
                    if (linkId) {
                        linkId = linkId.replace(/[^a-zA-Z0-9-_]/g, '');
                        if (!linkId) linkId = paymentId;
                    } else {
                        linkId = paymentId;
                    }

                    resultado.className = 'resultado sucesso';
                    resultado.style.display = 'block';
                    mensagem.textContent = '✅ Cobrança gerada com sucesso!';

                    detalhes.innerHTML = `
                        <div class="link-cobranca">
                            🔗 Link: <a href="/p/${linkId}" target="_blank">/p/${linkId}</a>
                        </div>
                        <button class="btn-copiar" onclick="copiar('https://alicevipz.vercel.app/p/${linkId}')">📋 Copiar link</button>
                        <div class="pix-info">
                            <p style="color:#888;font-size:13px;margin:8px 0;">📱 QR Code:</p>
                            <img src="${qrCode}" alt="QR Code" />
                            <p style="color:#888;font-size:13px;margin:8px 0;">📋 Código PIX:</p>
                            <textarea rows="2" readonly>${codigoPix || paymentId}</textarea>
                            <button class="btn-copiar" onclick="copiar('${codigoPix || paymentId}')">📋 Copiar código</button>
                        </div>
                        <p style="color:#555;font-size:11px;margin-top:8px;">ID: ${paymentId}</p>
                    `;
                } else {
                    resultado.className = 'resultado erro';
                    resultado.style.display = 'block';
                    mensagem.textContent = '❌ ' + (data.message || 'Erro ao gerar cobrança');
                    detalhes.innerHTML = '';
                }

            } catch (error) {
                console.error('❌ Erro:', error);
                resultado.className = 'resultado erro';
                resultado.style.display = 'block';
                mensagem.textContent = '❌ Erro ao gerar cobrança. Tente novamente.';
                detalhes.innerHTML = '';
            }
        }

        function copiar(texto) {
            navigator.clipboard.writeText(texto);
            alert('✅ Copiado!');
        }
    </script>
</body>
</html>
